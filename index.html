<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="description" content="Scrimba food ordering project">
   <meta name="author" content="Jamie">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="index.css">
   <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
   <title>Jimmy's Diner</title>
</head>

<body>
   <div id="main-container">
      <header>
         <img src="images/burgerbanner.png" alt="One of Jimmy's famous burgers." class="banner-img">
         <h1>Jimmy's Diner</h1>
         <p class="header-tag">The best burgers and pizzas in town</p>
      </header>
      <main id="app-container">

         <article id="basket" class="hidden">
            <h2 class="basket-heading">Your order</h2>
            <section id="basket-contents">

            </section>
            <section id="total">
               <h2>Total price:</h2>
               <p class="price">£<span id="basket-total">0</span></p>
            </section>
            <section id="complete-order">
               <div class="confirm-btn complete-btn" role="button">Complete order</div>
            </section>
         </article>
         <section id="message" class="message hidden">
            <p>Thanks, <span id="customer-name"></span>! Your order is on it's way!</p>
         </section>
         <article id="modal-container" class="modal-container hidden">
            <form id="modal" class="modal hidden">
               <h2 class="modal-heading">Enter card details</h2>
               <input type="text" id="name" name="name" placeholder="Enter your name" required>
               <input type="tel" id="card-number" name="card-number" inputmode="numeric" pattern="[0-9\s]{13,19}"
                  placeholder="Enter card number" required>
               <input type="tel" id="cvv" name="cvv" inputmode="numeric" pattern="[0-9\s]{3}" placeholder="Enter CVV"
                  required>
               <button class="confirm-btn pay-btn" role="button">Pay</button>
            </form>
         </article>
      </main>
   </div>
   <script type="module" src="index.js"></script>
</body>

</html>
